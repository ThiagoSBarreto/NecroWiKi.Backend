services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: necro_wiki_api

    restart: unless-stopped

    ports:
      - "6018:8080"

    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb_local;Port=3306;Database=NecroWiKi;User=necrowiki;Password=necrowiki123;"
      SaveStates__Path: /saves
      TZ: "America/Sao_Paulo"

    networks:
      - necro_network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - /mnt/hd2/Games:/games
      - /mnt/hd2/Games/SAVES:/saves

networks:
  necro_network:
    external: true